<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zine | Grace Wang</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ---- ZINE PAGE LAYOUT ---- */
        .zine-main {
            min-height: calc(100vh - var(--header-height));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px 16px;
            user-select: none;
        }

        /* ---- VIEWER WRAPPER ---- */
        .zine-viewer {
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            -webkit-tap-highlight-color: transparent;
        }

        /* ---- STATE MANAGEMENT ---- */
        .zine-state {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .zine-state.active {
            display: flex;
            animation: zineAppear 0.38s ease-out forwards;
        }

        .zine-state.flip-back {
            animation: zineAppearBack 0.38s ease-out forwards;
        }

        @keyframes zineAppear {
            from {
                opacity: 0;
                transform: perspective(900px) rotateY(-8deg) scale(0.975);
            }
            to {
                opacity: 1;
                transform: perspective(900px) rotateY(0deg) scale(1);
            }
        }

        @keyframes zineAppearBack {
            from {
                opacity: 0;
                transform: perspective(900px) rotateY(8deg) scale(0.975);
            }
            to {
                opacity: 1;
                transform: perspective(900px) rotateY(0deg) scale(1);
            }
        }

        /* ---- INDIVIDUAL PAGE LEAF ---- */
        .zine-leaf {
            background: #ffffff;
            aspect-ratio: 550 / 850;
            flex-shrink: 0;
            /* Mobile default: width-based from spread container */
            width: 50%;
        }

        /* ---- COVER STATE ---- */
        .cover-state .zine-leaf {
            box-shadow:
                3px 4px 12px rgba(0, 0, 0, 0.14),
                1px 2px 4px rgba(0, 0, 0, 0.08);
        }

        /* ---- SPREAD STATE ---- */
        .zine-spread {
            display: flex;
            position: relative;
            box-shadow:
                0 6px 24px rgba(0, 0, 0, 0.14),
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Central crease / spine shadow */
        .zine-spread::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            height: 100%;
            width: 3px;
            transform: translateX(-50%);
            background: linear-gradient(to right,
                rgba(0, 0, 0, 0.09) 0%,
                rgba(0, 0, 0, 0.03) 40%,
                rgba(0, 0, 0, 0.03) 60%,
                rgba(0, 0, 0, 0.09) 100%
            );
            pointer-events: none;
            z-index: 1;
        }

        /* ---- PAGE IMAGES ---- */
        .zine-leaf {
            overflow: hidden;
        }

        .zine-leaf img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ---- HINT TEXT ---- */
        .zine-hint {
            font-size: 12px;
            color: var(--text-gray);
            letter-spacing: 0.4px;
            font-weight: 400;
        }

        /* ---- PROGRESS DOTS ---- */
        .zine-progress {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        .zine-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #d0d0d0;
            transition: background 0.25s ease;
        }

        .zine-dot.active {
            background: #000;
        }

        /* ---- MOBILE SIZING ---- */
        /* Spread spans full width minus 32px margin (16px each side) */
        .zine-spread,
        .cover-state {
            /* Cover single page: half of the spread width */
        }

        /* Mobile: spread is 100vw - 32px, each leaf is 50% of that */
        @media (max-width: 950px) {
            .zine-spread {
                width: calc(100vw - 32px);
            }

            .cover-state .zine-leaf {
                /* Single cover page = same width as one spread page */
                width: calc((100vw - 32px) / 2);
            }
        }

        /* ---- DESKTOP SIZING (height-based, ~50% vertical space for spread) ---- */
        @media (min-width: 951px) {
            .zine-leaf {
                /* Use height to control size; aspect-ratio handles width automatically */
                width: auto;
                height: calc((100vh - var(--header-height) - 100px) * 1.0);
            }
        }
    </style>
</head>

<body>

        <!-- Progress dots (outside viewer so they don't trigger flip) -->
        <div class="zine-progress" id="zineProgress">
            <div class="zine-dot active" data-index="0"></div>
            <div class="zine-dot" data-index="1"></div>

            <div class="zine-dot" data-index="7"></div>

            <div class="zine-dot" data-index="9"></div>
            <div class="zine-dot" data-index="10"></div>
        </div>
    </main>

    <script>
        let currentState = 0;
        const totalStates = 11;

        document.getElementById('zineViewer').addEventListener('click', function () {
            const prevEl = document.getElementById(`state-${currentState}`);
            prevEl.classList.remove('active', 'flip-back');
            prevEl.style.display = 'none';

            const prevDot = document.querySelector(`.zine-dot[data-index="${currentState}"]`);
            prevDot.classList.remove('active');

            const isGoingBack = false; // Always go forward; change if you add back navigation
            currentState = (currentState + 1) % totalStates;

            const nextEl = document.getElementById(`state-${currentState}`);
            nextEl.style.display = '';
            nextEl.classList.remove('active', 'flip-back');
            // Force reflow so animation restarts
            void nextEl.offsetWidth;
            nextEl.classList.add('active');

            const nextDot = document.querySelector(`.zine-dot[data-index="${currentState}"]`);
            nextDot.classList.add('active');
        });
    </script>
